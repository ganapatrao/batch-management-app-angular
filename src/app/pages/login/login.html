<div class="login-wrapper d-flex align-items-center justify-content-center vh-100">
  <div class="card login-card border-0">
    <div class="card-body p-5">
      
      <div class="text-center mb-4">
        <div class="brand-icon mb-3">
          <span class="fs-2 fw-bold tracking-tight">Batch Management</span>
        </div>
        <h4 class="fw-bold">Welcome back</h4>
        <p class="text-muted small">Enter your credentials to access your account</p>
      </div>

      <form>
        <div class="mb-3">
          <label class="form-label fw-medium small">Email Address</label>
          <input type="email" class="form-control custom-input" placeholder="name@example.com" [(ngModel)]="loginObj.email" name="email">
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between">
            <label class="form-label fw-medium small">Password</label>
            <a href="#" class="small text-decoration-none text-primary">Forgot password?</a>
          </div>
          <input type="password" class="form-control custom-input" placeholder="••••••••" [(ngModel)]="loginObj.password" name="password">
        </div>

               <button type="submit" class="btn btn-dark w-100 py-2 fw-bold mb-3 shadow-sm" (click)="login()">
         login 
        </button> 

        <!-- <div class="mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe">
            <label class="form-check-label small text-muted" for="rememberMe">
              Remember this device
            </label>
          </div>
        </div>


        
        <button type="button" class="btn btn-outline-secondary w-100 py-2 fw-medium d-flex align-items-center justify-content-center gap-2">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="Google">
          Sign in with Google
        </button> -->
      </form>

      <div class="text-center mt-4">
        <p class="small text-muted mb-0">New here? <a href="#" class="text-decoration-none fw-bold">Create an account</a></p>
      </div>
      
    </div>
  </div>
</div>
